<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-H2V8YQGPY5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-H2V8YQGPY5');
</script>
<title>Clientes & Cases — Goellner Ferreira</title>
<meta name="description" content="Cases de consultoria estratégica, auditoria e finanças da Goellner Ferreira — empresas e instituições atendidas em Manaus, São Paulo e região." />
<link rel="icon" type="image/png" href="assets/gf-symbol.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="cases.css" />
</head>
<body data-accent="coral" data-corners="soft">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
const { useState, useEffect } = React;

const NAV = [
  { id: "inicio", label: "Início", href: "index.html#inicio" },
  { id: "sobre", label: "Sobre", href: "index.html#sobre" },
  { id: "solucoes", label: "Soluções", href: "index.html#solucoes" },
  { id: "socios", label: "Sócios", href: "index.html#socios" },
  { id: "blog", label: "Blog", href: "blog/" },
  { id: "cases", label: "Clientes & Cases", href: "cases.html" },
  { id: "contato", label: "Contato", href: "index.html#contato" },
];

const CLIENTS = [
  { logo: "assets/clients/bartender-store.png", name: "Bartender Store", desc: "Estruturação financeira e societária que ajudou a ampliar a operação e o lucro líquido da empresa de forma consistente.", url: "" },
  { logo: "assets/clients/manaus-plaza.png", name: "Manaus Plaza Shopping & Convenções", desc: "Suporte estratégico em processos administrativos, financeiros e de governança corporativa.", url: "" },
  { logo: "assets/clients/connect-device.png", name: "Connect Device", desc: "Auditoria de processos e apoio à gestão financeira, com foco em eficiência e controle.", url: "" },
  { logo: "assets/clients/tarsila-do-amaral.jpeg", name: "Residencial Tarsila do Amaral", desc: "Consultoria em governança condominial e estruturação de processos financeiros.", url: "" },
  { logo: "assets/clients/verde-brasil-cor.svg", name: "Verde Brasil", desc: "Reestruturação de processos industriais e implementação de rotinas de compliance.", url: "" },
];

const PARTNERS = [
  { logo: "assets/clients/ciesp-sbc.png", name: "CIESP São Bernardo do Campo" },
  { logo: "assets/clients/sesi.jpeg", name: "SESI" },
  { logo: "assets/clients/senai.png", name: "SENAI" },
  { logo: "assets/clients/iel.jpeg", name: "IEL — Instituto Euvaldo Lodi" },
  { logo: "assets/clients/prodam.png", name: "PRODAM" },
  { logo: "assets/clients/ciama.jpeg", name: "CIAMA" },
  { logo: "assets/clients/amazonastur.jpeg", name: "Amazonastur" },
];

const TESTIMONIALS = [
  { p: "Obrigado pela sua contribuição na estruturação dos processos da empresa. Seu profissionalismo e seriedade ficaram marcados na sua passagem por nossa empresa.", role: "Presidente" },
  { p: "Ficou excelente a estruturação... o fato é que agora temos uma arquitetura pensada globalmente. E isso dá segurança para prosseguirmos.", role: "Conselheiro" },
  { p: "Agradeço demais a você por esse trabalho excelente realizado.", role: "Diretor Geral" },
  { p: "O legado que deixas é admirável. Seu conhecimento, profissionalismo e disponibilidade nos causaram forte impressão.", role: "Conselheiro" },
];

function Icon({ d, ...p }) {
  return <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...p}><path d={d}/></svg>;
}
const ARROW = "M5 12h14M13 6l6 6-6 6";
const EXTERNAL = "M14 3h7v7M21 3l-9 9M19 13v6a2 2 0 01-2 2H6a2 2 0 01-2-2V8a2 2 0 012-2h6";

function Header() {
  const [stuck, setStuck] = useState(false);
  const [open, setOpen] = useState(false);
  useEffect(() => {
    const f = () => setStuck(window.scrollY > 12);
    f(); window.addEventListener("scroll", f);
    return () => window.removeEventListener("scroll", f);
  }, []);
  return (
    <header className="site-header" data-stuck={stuck}>
      <div className="wrap nav">
        <a href="index.html"><img className="nav-logo" src="assets/logo-gf.png" alt="Goellner Ferreira" /></a>
        <nav className="nav-links">
          {NAV.map((n) => <a key={n.id} className={"nav-link" + (n.id === "cases" ? " active" : "")} href={n.href}>{n.label}</a>)}
        </nav>
        <div className="nav-cta"><a className="btn btn-accent" href="index.html#contato">Fale com um especialista</a></div>
        <button className="hamburger" aria-label="Menu" onClick={() => setOpen(!open)}><span></span><span></span><span></span></button>
      </div>
      <div className={"mobile-menu" + (open ? " open" : "")}>
        {NAV.map((n) => <a key={n.id} href={n.href}>{n.label}</a>)}
      </div>
    </header>
  );
}

function Footer() {
  return (
    <footer className="footer">
      <div className="wrap footer-top">
        <div className="footer-col">
          <img className="footer-logo" src="assets/gf-symbol.png" alt="Goellner Ferreira" style={{filter:"brightness(0) invert(1)", height:44}} />
          <p className="footer-about">Soluções em consultoria estratégica.</p>
        </div>
        <div className="footer-col">
          <h5>Navegação</h5>
          <a href="index.html#inicio">Início</a>
          <a href="index.html#sobre">Sobre</a>
          <a href="index.html#solucoes">Soluções</a>
          <a href="blog/">Blog</a>
          <a href="cases.html">Clientes & Cases</a>
          <a href="index.html#contato">Contato</a>
        </div>
        <div className="footer-col">
          <h5>Contato</h5>
          <a href="tel:+5592981125980">Silvana · +55 92 9 8112-5980</a>
          <a href="tel:+5511999773787">Jonatas · +55 11 9 9977-3787</a>
          <a href="https://www.instagram.com/goellnerferreira/" target="_blank" rel="noopener">@goellnerferreira</a>
        </div>
      </div>
      <div className="wrap footer-bottom">
        <span>© {new Date().getFullYear()} Goellner Ferreira. Todos os direitos reservados.</span>
        <span className="footer-credit">Desenvolvido por <a href="https://www.agencianovarota.com.br" target="_blank" rel="noopener">NovaRotaMkt</a></span>
      </div>
    </footer>
  );
}

function ClientCard({ c }) {
  return (
    <div className="client-card">
      <div className="client-logo-wrap"><img src={c.logo} alt={c.name} loading="lazy" /></div>
      <h3>{c.name}</h3>
      <p>{c.desc}</p>
      {c.url ? (
        <a className="client-link" href={c.url} target="_blank" rel="noopener">Visitar site <Icon d={EXTERNAL} /></a>
      ) : null}
    </div>
  );
}

function App() {
  return (
    <React.Fragment>
      <Header />
      <section className="cases-hero">
        <div className="wrap cases-hero-inner">
          <span className="eyebrow">Clientes &amp; Cases</span>
          <h1>Empresas que <em>confiam</em> na Goellner Ferreira</h1>
          <p>Auditoria, consultoria estratégica e finanças aplicadas a negócios reais — conheça algumas das empresas e instituições que caminham com a gente.</p>
        </div>
      </section>

      <section className="cases-section">
        <div className="wrap">
          <div className="cases-shead">
            <span className="eyebrow">Cases de clientes</span>
            <h2>Resultados construídos caso a caso</h2>
            <p>Cada projeto é conduzido lado a lado com o cliente — do diagnóstico à implementação.</p>
          </div>
          <div className="client-grid">
            {CLIENTS.map((c) => <ClientCard key={c.name} c={c} />)}
          </div>
        </div>
      </section>

      <section className="cases-section alt">
        <div className="wrap">
          <div className="cases-shead">
            <span className="eyebrow">O que dizem sobre nós</span>
            <h2>Quem trabalhou com a gente</h2>
          </div>
          <div className="testi-grid">
            {TESTIMONIALS.map((t, i) => (
              <div key={i} className="testi-card">
                <p>"{t.p}"</p>
                <div className="testi-role">{t.role}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      <section className="cases-section">
        <div className="wrap">
          <div className="cases-shead">
            <span className="eyebrow">Instituições &amp; parceiros</span>
            <h2>Presença institucional</h2>
            <p>Relacionamentos e participação em entidades de classe e instituições da região.</p>
          </div>
          <div className="partner-grid">
            {PARTNERS.map((p) => (
              <div key={p.name} className="partner-card" title={p.name}>
                <img src={p.logo} alt={p.name} loading="lazy" />
              </div>
            ))}
          </div>
        </div>
      </section>

      <section className="ctaband">
        <div className="wrap ctaband-inner">
          <div>
            <h2>Sua empresa pode ser o próximo case</h2>
            <p>Conte o seu desafio. A primeira conversa é com um dos sócios.</p>
          </div>
          <a className="btn btn-light" style={{padding:"17px 32px", fontSize:16}} href="index.html#contato">
            Falar com um especialista <Icon d={ARROW} />
          </a>
        </div>
      </section>

      <Footer />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
