<style>
  :root{
    --navy-900:#07193f; --navy-800:#0a2150; --navy-700:#102a63; --navy-600:#16387f;
    --royal:#0e76cf; --sky:#6cbfe0; --teal:#1f8a82; --coral:#ff5757; --coral-deep:#e23f3f;
    --ink:#14203f; --paper:#ffffff;
    --grad-brand:linear-gradient(150deg,var(--navy-800) 0%,var(--navy-600) 46%,#0a5aa3 76%,var(--teal) 105%);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    font-family:"Montserrat",system-ui,sans-serif;
    color:#fff; min-height:100vh; min-height:100dvh;
    background:var(--grad-brand); background-attachment:fixed;
    display:flex; justify-content:center;
    padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
    -webkit-font-smoothing:antialiased;
    position:relative; overflow-x:hidden;
  }
  /* textura de grade */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:54px 54px;
    -webkit-mask-image:radial-gradient(120% 80% at 70% 0%,#000,transparent 72%);
            mask-image:radial-gradient(120% 80% at 70% 0%,#000,transparent 72%);
  }
  body::after{
    content:""; position:fixed; right:-20%; top:-14%; width:80vw; height:80vw; max-width:560px; max-height:560px;
    background:radial-gradient(circle,rgba(108,191,224,.4),transparent 62%); pointer-events:none;
  }
  .shell{
    width:100%; max-width:460px; padding:46px 24px 40px;
    display:flex; flex-direction:column; align-items:center;
    position:relative; z-index:1;
  }
  .logo{ width:230px; max-width:74%; height:auto; filter:brightness(0) invert(1); }
  .tagline{
    margin-top:20px; font-size:13.5px; font-weight:500; letter-spacing:.02em;
    color:rgba(255,255,255,.82); text-align:center; line-height:1.55; max-width:30ch;
  }
  .divider{ width:44px; height:3px; border-radius:3px; background:var(--coral); margin:24px 0 30px; }

  .links{ width:100%; display:flex; flex-direction:column; gap:14px; }
  .link{
    --c:var(--coral);
    display:flex; align-items:center; gap:16px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.16);
    border-radius:16px; padding:16px 18px;
    color:#fff; text-decoration:none;
    backdrop-filter:blur(8px);
    transition:transform .16s ease, background .2s, border-color .2s, box-shadow .25s;
    position:relative; overflow:hidden;
  }
  .link:hover, .link:focus-visible{
    transform:translateY(-2px);
    background:rgba(255,255,255,.12);
    border-color:rgba(255,255,255,.32);
    box-shadow:0 14px 30px rgba(0,0,0,.22);
    outline:none;
  }
  .link:active{ transform:translateY(0); }
  .l-ic{
    flex:none; width:46px; height:46px; border-radius:12px;
    background:var(--c); color:#fff; display:grid; place-items:center;
    box-shadow:0 6px 16px rgba(0,0,0,.22);
  }
  .l-ic svg{ width:23px; height:23px; display:block; }
  .l-txt{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .l-title{ font-size:15.5px; font-weight:700; line-height:1.25; display:block; }
  .l-sub{ font-size:12.5px; color:rgba(255,255,255,.66); margin-top:3px; font-weight:500; display:block; }
  .l-arrow{ flex:none; color:rgba(255,255,255,.45); transition:transform .18s, color .2s; }
  .link:hover .l-arrow{ transform:translateX(3px); color:#fff; }

  .section-label{
    align-self:flex-start; font-size:11px; font-weight:700; letter-spacing:.16em;
    text-transform:uppercase; color:var(--sky); margin:24px 2px 4px;
  }

  .footer{
    margin-top:34px; text-align:center; font-size:11.5px; color:rgba(255,255,255,.5);
    line-height:1.7;
  }
  .footer a{ color:rgba(255,255,255,.66); text-decoration:none; font-weight:600; }
  .footer a:hover{ color:#fff; }
  .footer .credit{ display:block; margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,.1); font-size:11px; color:rgba(255,255,255,.42); }
  .footer .credit a{ color:var(--sky); }

  @media (max-width:380px){
    .shell{ padding:38px 18px 34px; }
    .l-title{ font-size:14.5px; }
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;} }

@media(max-width:640px){.foot a,footer a{display:inline-flex;align-items:center;min-height:36px}}</style>
</head>
