  <style>
/* ============================================================
   Goellner Ferreira — Consultoria Estratégica
   Sistema visual (tokens + componentes)
   Cores derivadas da logo: marinho #183078 · petróleo #0E7C7B
   ============================================================ */

:root {
  /* Marinho (azul da marca / posts) */
  --navy-900: #07193f;
  --navy-800: #0a2150;
  --navy-700: #102a63;
  --navy-600: #16387f;
  --navy-500: #1e4aa0;

  /* Azul royal (títulos nos posts) */
  --royal:      #0e76cf;
  --royal-deep: #0a5aa3;

  /* Azul-céu (formas) */
  --sky:   #6cbfe0;
  --sky-2: #a9dcef;

  /* Petróleo / teal (verde da marca) */
  --teal-800: #0c5f59;
  --teal-700: #11756c;
  --teal-600: #1f8a82;
  --teal-500: #2aa295;
  --teal-300: #6fc3ba;

  /* Coral — cor de destaque dos posts */
  --coral:      #ff5757;
  --coral-deep: #e23f3f;

  /* Neutros quentes */
  --cream:   #f3efe7;
  --cream-2: #ebe5d8;
  --paper:   #ffffff;
  --paper-2: #fbf9f4;

  --ink:    #14203f;
  --muted:  #56607a;
  --faint:  #8992a8;
  --line:   rgba(10, 33, 80, .12);
  --line-2: rgba(10, 33, 80, .07);

  /* Acento (tweakable) — padrão coral (destaque dos posts) */
  --accent:      var(--coral);
  --accent-deep: var(--coral-deep);
  --accent-soft: rgba(255, 87, 87, .12);

  /* Azul de títulos / links */
  --head-color: var(--navy-800);

  /* Gradiente da marca (marinho → royal → petróleo) */
  --grad-brand: linear-gradient(120deg, var(--navy-800) 0%, var(--navy-600) 46%, var(--royal-deep) 78%, var(--teal-700) 100%);

  /* Tipografia (tweakable) — Montserrat, como nos posts */
  --font-head: "Montserrat", system-ui, sans-serif;
  --font-body: "Montserrat", system-ui, sans-serif;

  --radius: 16px;
  --radius-sm: 10px;
  --radius-lg: 26px;

  --shadow-sm: 0 1px 2px rgba(16,30,68,.05), 0 2px 8px rgba(16,30,68,.05);
  --shadow-md: 0 8px 30px rgba(16,30,68,.10), 0 2px 8px rgba(16,30,68,.06);
  --shadow-lg: 0 30px 70px rgba(16,30,68,.18);

  --maxw: 1180px;
  --gut: clamp(20px, 5vw, 64px);
}

/* Acentos alternativos */
body[data-accent="royal"] {
  --accent: var(--royal);
  --accent-deep: var(--royal-deep);
  --accent-soft: rgba(14, 118, 207, .12);
}
body[data-accent="teal"] {
  --accent: var(--teal-600);
  --accent-deep: var(--teal-800);
  --accent-soft: rgba(31, 138, 130, .12);
}
body[data-accent="navy"] {
  --accent: var(--navy-600);
  --accent-deep: var(--navy-800);
  --accent-soft: rgba(22, 56, 127, .12);
}

/* Cantos retos */
body[data-corners="sharp"] {
  --radius: 3px;
  --radius-sm: 2px;
  --radius-lg: 4px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--cream);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 {
  font-family: var(--font-head);
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -0.018em;
  color: var(--head-color);
  text-wrap: balance;
}

p { text-wrap: pretty; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

/* ---------- Layout helpers ---------- */
.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--gut); }
.section { padding-block: clamp(72px, 9vw, 128px); }

.eyebrow {
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--accent);
  display: inline-flex;
  align-items: center;
  gap: 12px;
}
.eyebrow::before {
  content: "";
  width: 28px; height: 2px;
  background: var(--accent);
  display: inline-block;
}
.eyebrow.center::before { display: none; }

.h-lead {
  font-size: clamp(13px, 1.1vw, 14px);
  color: var(--muted);
  max-width: 56ch;
  line-height: 1.7;
}

/* ---------- Buttons ---------- */
.btn {
  --b: var(--navy-800);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: .01em;
  padding: 15px 28px;
  border-radius: 999px;
  border: 1.5px solid transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: transform .18s ease, box-shadow .25s ease, background .2s, color .2s, border-color .2s;
  white-space: nowrap;
}
.btn svg { width: 17px; height: 17px; }
.btn-primary {
  background: var(--navy-800);
  color: #fff;
  box-shadow: 0 10px 26px rgba(16,30,68,.22);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(16,30,68,.30); }
.btn-accent {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 10px 26px var(--accent-soft);
}
.btn-accent:hover { transform: translateY(-2px); filter: brightness(1.05); }
.btn-ghost {
  background: transparent;
  color: var(--navy-800);
  border-color: var(--line);
}
.btn-ghost:hover { border-color: var(--navy-700); background: var(--paper); }
.btn-light {
  background: rgba(255,255,255,.12);
  color: #fff;
  border-color: rgba(255,255,255,.28);
  backdrop-filter: blur(6px);
}
.btn-light:hover { background: rgba(255,255,255,.2); }

/* ---------- Header / Nav ---------- */
.site-header {
  position: sticky; top: 0; z-index: 60;
  background: rgba(243,239,231,.72);
  backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid transparent;
  transition: border-color .3s, background .3s, box-shadow .3s;
}
.site-header[data-stuck="true"] {
  background: rgba(247,244,238,.9);
  border-bottom-color: var(--line);
  box-shadow: 0 6px 24px rgba(16,30,68,.06);
}
.nav {
  display: flex; align-items: center; gap: 28px;
  height: 92px;
}
.nav-logo { height: 62px; width: auto; }
.nav-links {
  display: flex; align-items: center; gap: 6px;
  margin-left: auto;
}
.nav-link {
  font-size: 14.5px; font-weight: 500;
  color: var(--ink);
  padding: 9px 15px;
  border-radius: 999px;
  position: relative;
  transition: color .2s, background .2s;
}
.nav-link:hover { color: var(--accent); background: rgba(255,255,255,.55); }
.nav-cta { margin-left: 10px; }
.nav-cta .btn { padding: 12px 22px; font-size: 14px; }

.hamburger {
  margin-left: auto;
  display: none;
  flex-direction: column; gap: 5px;
  background: none; border: none; cursor: pointer;
  padding: 8px;
}
.hamburger span { width: 26px; height: 2px; background: var(--navy-800); border-radius: 2px; transition: .25s; }

/* mobile menu */
.mobile-menu {
  display: none;
  flex-direction: column;
  gap: 4px;
  padding: 12px var(--gut) 24px;
  background: var(--paper-2);
  border-bottom: 1px solid var(--line);
}
.mobile-menu.open { display: flex; }
.mobile-menu a { padding: 13px 8px; font-weight: 500; border-bottom: 1px solid var(--line-2); }
.mobile-menu .btn { margin-top: 10px; justify-content: center; }

/* ---------- Hero ---------- */
.hero {
  position: relative;
  background: var(--grad-brand);
  color: #fff;
  overflow: hidden;
  isolation: isolate;
}
.hero::before { /* fine grid texture */
  content: "";
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size: 64px 64px;
  -webkit-mask-image: radial-gradient(120% 100% at 78% 0%, #000 0%, transparent 72%);
          mask-image: radial-gradient(120% 100% at 78% 0%, #000 0%, transparent 72%);
  z-index: -1;
}
.hero::after { /* teal glow */
  content: "";
  position: absolute; right: -10%; top: -30%;
  width: 60vw; height: 60vw; max-width: 720px; max-height: 720px;
  background: radial-gradient(circle, rgba(108,191,224,.45), transparent 62%);
  z-index: -1;
}
.hero-inner {
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  gap: clamp(40px, 5vw, 80px);
  align-items: center;
  padding-block: clamp(80px, 10vw, 132px);
}
.hero .eyebrow { color: var(--sky); }
.hero .eyebrow::before { background: var(--sky); }
.hero h1 {
  color: #fff;
  font-size: clamp(38px, 5vw, 64px);
  font-weight: 800;
  margin-top: 22px;
}
.hero h1 em { font-style: italic; color: var(--coral); }
.hero-sub {
  margin-top: 30px;
  font-size: clamp(17px, 1.5vw, 20px);
  color: rgba(255,255,255,.82);
  max-width: 46ch;
  line-height: 1.65;
}
.hero-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 38px; }

/* hero side card */
.hero-card {
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.16);
  border-radius: var(--radius-lg);
  padding: 30px;
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow-lg);
}
.hero-photo {
  border-radius: var(--radius);
  aspect-ratio: 4/3.2;
  margin-bottom: 22px;
}
/* hero: dupla de sócios */
.hero-team { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.hero-team-member { text-align: center; }
.hero-team-member img {
  width: 100%; aspect-ratio: 1/1; object-fit: cover;
  border-radius: var(--radius);
  border: 1px solid rgba(255,255,255,.18);
}
.htm-name { font-family: var(--font-head); font-weight: 700; font-size: 16px; color: #fff; margin-top: 12px; }
.htm-role { font-size: 12.5px; color: var(--sky); margin-top: 3px; }
.hero-team-cap {
  text-align: center; font-size: 13px; color: rgba(255,255,255,.66);
  margin: 18px 0 22px; padding-bottom: 20px;
  border-bottom: 1px solid rgba(255,255,255,.14);
}
.hero-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 14px; }
.hero-stat .n {
  font-family: var(--font-head);
  font-size: 34px; font-weight: 600;
  color: #fff; line-height: 1;
}
.hero-stat .n span { color: var(--coral); }
.hero-stat .l { font-size: 13px; color: rgba(255,255,255,.7); margin-top: 7px; line-height: 1.4; }

/* ---------- Placeholder de imagem ---------- */
.ph {
  position: relative;
  background:
    repeating-linear-gradient(135deg, rgba(24,38,84,.05) 0 10px, rgba(24,38,84,.02) 10px 20px),
    var(--cream-2);
  border: 1px dashed rgba(24,38,84,.22);
  display: grid; place-items: center;
  color: var(--faint);
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 12px; letter-spacing: .04em;
  text-align: center;
  overflow: hidden;
}
.ph.on-dark {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 10px, rgba(255,255,255,.03) 10px 20px),
    rgba(255,255,255,.04);
  border-color: rgba(255,255,255,.22);
  color: rgba(255,255,255,.66);
}
.ph span { padding: 8px 12px; }

/* ---------- Trust strip ---------- */
.trust {
  background: var(--paper-2);
  border-bottom: 1px solid var(--line);
  border-top: 1px solid var(--line);
}
.trust-inner {
  display: flex; align-items: center; gap: clamp(20px,4vw,56px);
  padding-block: 30px; flex-wrap: wrap;
}
.trust-label { font-size: 13px; color: var(--muted); font-weight: 500; max-width: 18ch; }
.trust-logos { display: flex; align-items: center; gap: clamp(22px,4vw,52px); flex-wrap: wrap; flex: 1; }
.trust-logos .ph { height: 30px; width: 116px; border-radius: 4px; font-size: 10px; opacity: .8; }

/* ---------- Section heads ---------- */
.shead { max-width: 720px; }
.shead.center { margin-inline: auto; text-align: center; }
.shead h2 { font-size: clamp(30px, 3.6vw, 47px); margin-top: 18px; }
.shead p { margin-top: 18px; color: var(--muted); font-size: 18px; }

/* ---------- About ---------- */
.about { background: var(--cream); }
.about-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: clamp(36px, 5vw, 76px); align-items: center;
}
.about-copy p { color: var(--muted); margin-top: 18px; font-size: 17.5px; }
.about-copy strong { color: var(--navy-800); font-weight: 700; }
.about-visual { position: relative; }
.about-photo { border-radius: var(--radius-lg); aspect-ratio: 4/4.4; box-shadow: var(--shadow-md); position: relative; z-index: 1; }
/* pétala orgânica (motivo dos posts) */
.about-visual::before {
  content: ""; position: absolute; z-index: 0;
  right: -34px; top: -34px; width: 150px; height: 150px;
  background: var(--teal-600);
  border-radius: 70% 30% 65% 35% / 40% 60% 40% 60%;
  opacity: .9;
}
.about-badge {
  position: absolute; left: -26px; bottom: 34px;
  background: var(--paper); border-radius: var(--radius);
  padding: 22px 26px; box-shadow: var(--shadow-md);
  border: 1px solid var(--line); max-width: 230px;
}
.about-badge .n { font-family: var(--font-head); font-size: 40px; color: var(--royal); font-weight: 800; line-height: 1; letter-spacing: .02em; }
.about-badge .l { font-size: 13.5px; color: var(--muted); margin-top: 8px; }

/* mvv cards */
.mvv { display: grid; gap: 16px; margin-top: 30px; }
.mvv-card {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 24px 26px;
  display: flex; gap: 18px; align-items: flex-start;
  box-shadow: var(--shadow-sm);
  transition: transform .2s, box-shadow .2s;
}
.mvv-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.mvv-ic {
  flex: none; width: 46px; height: 46px; border-radius: 12px;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center;
}
.mvv-ic svg { width: 22px; height: 22px; }
.mvv-card h4 { font-size: 19px; color: var(--navy-800); }
.mvv-card p { font-size: 15px; color: var(--muted); margin-top: 6px; line-height: 1.55; }

/* ---------- Services ---------- */
.services { background: var(--navy-900); color: #fff; position: relative; overflow: hidden; isolation: isolate; }
.services::before {
  content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size: 70px 70px;
  -webkit-mask-image: radial-gradient(120% 90% at 15% 0%, #000, transparent 70%);
          mask-image: radial-gradient(120% 90% at 15% 0%, #000, transparent 70%);
  z-index: -1;
}
.services .shead h2 { color: #fff; }
.services .shead p { color: rgba(255,255,255,.72); }
.services .eyebrow { color: var(--teal-300); }
.services .eyebrow::before { background: var(--teal-300); }
.svc-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 18px; margin-top: 52px;
}
.svc-card {
  background: rgba(255,255,255,.045);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: var(--radius);
  padding: 32px 30px 34px;
  transition: transform .22s ease, background .22s, border-color .22s;
  position: relative; overflow: hidden;
}
.svc-card:hover { transform: translateY(-4px); background: rgba(255,255,255,.075); border-color: rgba(111,195,186,.4); }
.svc-num {
  font-family: var(--font-head);
  font-size: 14px; color: var(--coral); font-weight: 700;
  letter-spacing: .1em;
}
.svc-ic {
  width: 54px; height: 54px; border-radius: 14px; margin: 22px 0 22px;
  background: var(--grad-brand);
  display: grid; place-items: center; color: #fff;
  box-shadow: 0 8px 20px rgba(0,0,0,.25);
}
.svc-ic svg { width: 26px; height: 26px; }
.svc-card h3 { color: #fff; font-size: 22px; }
.svc-card p { color: rgba(255,255,255,.72); font-size: 15px; margin-top: 12px; line-height: 1.6; }
.svc-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.svc-tag {
  font-size: 12px; color: rgba(255,255,255,.8);
  border: 1px solid rgba(255,255,255,.16);
  padding: 5px 11px; border-radius: 999px;
}

/* ---------- Diferenciais ---------- */
.diff { background: var(--paper-2); }
.diff-grid { display: grid; grid-template-columns: .85fr 1.15fr; gap: clamp(40px,5vw,80px); align-items: center; }
.diff-list { display: grid; gap: 6px; }
.diff-item { display: flex; gap: 20px; padding: 22px 0; border-bottom: 1px solid var(--line); }
.diff-item:last-child { border-bottom: none; }
.diff-no { font-family: var(--font-head); font-size: 18px; color: var(--accent); font-weight: 600; flex: none; width: 38px; }
.diff-item h4 { font-size: 21px; }
.diff-item p { color: var(--muted); font-size: 15.5px; margin-top: 7px; }

/* ---------- Confiado por (clientes) ---------- */
.clientstrip { background: var(--paper-2); }
.clientstrip-head { text-align: center; max-width: 640px; margin: 0 auto 36px; }
.clientstrip-head h2 { font-size: clamp(24px, 2.6vw, 34px); margin-top: 14px; }
.clientstrip-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
.clientstrip-logo { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); height: 84px; display: flex; align-items: center; justify-content: center; padding: 16px; box-shadow: var(--shadow-sm); transition: transform .2s, box-shadow .2s; }
.clientstrip-logo:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.clientstrip-logo img { max-height: 44px; max-width: 100%; object-fit: contain; }
.clientstrip-cta { text-align: center; margin-top: 32px; }
@media (max-width: 980px) { .clientstrip-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 560px) { .clientstrip-grid { grid-template-columns: repeat(2, 1fr); } }

/* ---------- Do nosso blog ---------- */
.blogfeat { background: var(--cream); }
.blogfeat-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 44px; flex-wrap: wrap; }
.blogfeat-head h2 { font-size: clamp(28px, 3.4vw, 44px); margin-top: 14px; }
.blogfeat-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 26px; align-items: stretch; }
.bf-feature { display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); transition: transform .2s, box-shadow .25s; }
.bf-feature:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.bf-cover { position: relative; aspect-ratio: 16/9; flex: 1; min-height: 240px; background: var(--cream-2); overflow: hidden; }
.bf-cover img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
.bf-feature:hover .bf-cover img { transform: scale(1.04); }
.bf-cover-fb { position: absolute; inset: 0; display: grid; place-items: center; background: var(--grad-brand); }
.bf-cover-fb svg { width: 46px; height: 46px; color: rgba(255,255,255,.5); }
.bf-chip { position: absolute; top: 16px; left: 16px; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #fff; background: var(--accent); padding: 6px 13px; border-radius: 999px; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
.bf-chip.sm { position: static; box-shadow: none; color: var(--accent); background: var(--accent-soft); align-self: flex-start; }
.bf-feature-body { padding: 26px 28px 30px; }
.bf-feature-body h3 { font-size: clamp(20px, 2vw, 27px); line-height: 1.2; }
.bf-feature-body p { color: var(--muted); font-size: 16px; margin-top: 12px; line-height: 1.55; }
.bf-meta { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--faint); font-weight: 500; margin-top: 18px; }
.bf-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); }
.bf-list { display: flex; flex-direction: column; gap: 18px; }
.bf-item { display: flex; gap: 18px; align-items: stretch; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); transition: transform .2s, box-shadow .25s; }
.bf-item:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.bf-thumb { flex: none; width: 116px; border-radius: var(--radius-sm); overflow: hidden; position: relative; background: var(--cream-2); }
.bf-thumb img { width: 100%; height: 100%; object-fit: cover; }
.bf-thumb .bf-cover-fb svg { width: 26px; height: 26px; }
.bf-item-body { display: flex; flex-direction: column; gap: 8px; padding: 4px 6px 4px 0; }
.bf-item-body h4 { font-size: 17.5px; line-height: 1.25; }
.bf-item-body .bf-meta { margin-top: auto; }

@media (max-width: 900px) {
  .blogfeat-grid { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .blogfeat-all { display: none; }
  .bf-item { flex-direction: column; }
  .bf-thumb { width: 100%; aspect-ratio: 16/9; }
}

/* ---------- CTA band ---------- */
.ctaband { background: var(--grad-brand); color: #fff; position: relative; overflow: hidden; isolation: isolate; }
.ctaband::after {
  content: ""; position: absolute; left: -8%; bottom: -60%;
  width: 50vw; height: 50vw; max-width: 600px; max-height: 600px;
  background: radial-gradient(circle, rgba(108,191,224,.4), transparent 64%);
  z-index: -1;
}
.ctaband-inner { display: flex; align-items: center; justify-content: space-between; gap: 40px; flex-wrap: wrap; padding-block: clamp(56px,7vw,88px); }
.ctaband h2 { color: #fff; font-size: clamp(28px, 3.4vw, 44px); max-width: 18ch; }
.ctaband p { color: rgba(255,255,255,.8); margin-top: 14px; max-width: 40ch; }

/* ---------- Contact ---------- */
.contact { background: var(--cream); }
.contact-grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: clamp(40px,5vw,72px); }
.contact-info .ci-item { display: flex; gap: 16px; align-items: flex-start; margin-top: 26px; }
.contact-info .ci-ic { flex: none; width: 48px; height: 48px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.contact-info .ci-ic svg { width: 21px; height: 21px; }
.contact-info .ci-item h4 { font-family: var(--font-body); font-size: 14px; color: var(--faint); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.contact-info .ci-item p { font-size: 17px; color: var(--ink); margin-top: 3px; overflow-wrap: anywhere; }
.contact-info .ci-item a { overflow-wrap: anywhere; word-break: break-word; }

.form {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: clamp(26px, 3vw, 40px);
  box-shadow: var(--shadow-md);
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; margin-top: 16px; }
.field { margin-top: 16px; }
.form > form > .form-row:first-child { margin-top: 0; }
.form-row .field { margin-top: 0; }
.form-row:first-child { margin-top: 0; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 7px; }
.field input, .field textarea, .field select {
  width: 100%;
  font-family: var(--font-body); font-size: 15.5px; color: var(--ink);
  background: var(--paper-2);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 13px 15px;
  transition: border-color .18s, box-shadow .18s, background .18s;
}
.field textarea { resize: vertical; min-height: 120px; }
.field input:focus, .field textarea:focus, .field select:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft); background: #fff;
}
.field.err input, .field.err textarea { border-color: #c0392b; }
.field .msg { font-size: 12.5px; color: #c0392b; margin-top: 6px; display: none; }
.field.err .msg { display: block; }
.form .btn { width: 100%; justify-content: center; margin-top: 22px; }
.form-note { font-size: 12.5px; color: var(--faint); text-align: center; margin-top: 14px; }
.form-error {
  background: rgba(192,57,43,.08); border: 1px solid rgba(192,57,43,.4);
  color: #c0392b; border-radius: var(--radius-sm);
  padding: 12px 14px; font-size: 13.5px; margin-top: 16px; text-align: center;
}
.form-wa { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); text-align: center; }
.form-wa-label { font-size: 13px; color: var(--muted); font-weight: 500; }
.form-wa-btns { display: flex; gap: 10px; margin-top: 12px; }
.wa-btn {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  background: #25D366; color: #fff; font-weight: 700; font-size: 14.5px;
  padding: 12px 16px; border-radius: 999px; text-decoration: none;
  transition: transform .16s ease, filter .2s;
}
.wa-btn:hover { transform: translateY(-2px); filter: brightness(1.04); }
.wa-btn svg { width: 18px; height: 18px; }
.form-success {
  background: var(--accent-soft); border: 1px solid var(--accent);
  color: var(--accent-deep); border-radius: var(--radius-sm);
  padding: 16px 18px; font-size: 15px; margin-top: 16px;
  display: flex; gap: 10px; align-items: center;
}

/* ---------- Footer ---------- */
.footer { background: var(--navy-900); color: rgba(255,255,255,.7); }
.footer-top { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 40px; padding-block: 64px 48px; }
.footer-logo { height: 52px; margin-bottom: 20px; }
.footer-about { font-size: 14.5px; line-height: 1.65; max-width: 32ch; }
.footer h5 { font-family: var(--font-body); color: #fff; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 18px; font-weight: 600; }
.footer-col a, .footer-col p { display: block; font-size: 14.5px; color: rgba(255,255,255,.66); padding: 7px 0; transition: color .18s; overflow-wrap: anywhere; }
.footer-col a:hover { color: var(--sky); }
.footer-bottom { border-top: 1px solid rgba(255,255,255,.12); padding-block: 26px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 13px; color: rgba(255,255,255,.5); }
.footer-credit { color: rgba(255,255,255,.55); }
.footer-credit a { color: var(--sky); font-weight: 600; }
.footer-credit a:hover { color: #fff; }
.footer-social { display: flex; gap: 10px; }
.footer-social a { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); display: grid; place-items: center; color: rgba(255,255,255,.7); }
.footer-social a:hover { background: rgba(255,255,255,.08); color: #fff; }
.footer-social svg { width: 17px; height: 17px; }

/* ---------- Reveal on scroll ---------- */
.reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s ease, transform .7s ease; }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  html { scroll-behavior: auto; }
}

/* ---------- Credibility chips (strip) ---------- */
.cred-chips { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cred-chips .chip {
  font-size: 13px; font-weight: 600; color: var(--navy-700);
  background: var(--paper); border: 1px solid var(--line);
  padding: 8px 16px; border-radius: 999px; white-space: nowrap;
}

/* ---------- Checks (sobre) ---------- */
.checks { display: grid; gap: 14px; margin-top: 28px; }
.check-item { display: flex; gap: 13px; align-items: flex-start; font-size: 16px; color: var(--ink); }
.check-item .ck {
  flex: none; width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent); color: #fff; display: grid; place-items: center;
}
.check-item .ck svg { width: 15px; height: 15px; }

/* ---------- Solutions: 4 grupos ---------- */
.sol-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 52px; }
.sol-list { display: grid; gap: 10px; margin-top: 18px; }
.sol-list li {
  list-style: none; font-size: 15px; color: rgba(255,255,255,.82);
  display: flex; gap: 11px; align-items: flex-start; line-height: 1.45;
}
.sol-list li::before {
  content: ""; flex: none; margin-top: 8px;
  width: 7px; height: 7px; border-radius: 2px; background: var(--coral);
}

/* ---------- Metodologia ---------- */
.method { background: var(--cream); }
.method-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 52px; counter-reset: step; }
.method-step {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 30px 26px 28px;
  position: relative; box-shadow: var(--shadow-sm);
  transition: transform .2s, box-shadow .2s;
}
.method-step:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.method-step .step-n {
  font-family: var(--font-head); font-weight: 800; font-size: 15px;
  color: var(--accent); letter-spacing: .08em;
}
.method-ic {
  width: 52px; height: 52px; border-radius: 14px; margin: 16px 0 18px;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center;
}
.method-ic svg { width: 25px; height: 25px; }
.method-step h4 { font-size: 18px; }
.method-step p { font-size: 14.5px; color: var(--muted); margin-top: 9px; line-height: 1.55; }
.method-note { margin-top: 34px; font-size: 18px; color: var(--navy-700); text-align: center; max-width: 60ch; margin-inline: auto; }
.method-note strong { color: var(--accent); }

/* ---------- Sócios ---------- */
.partners { background: var(--paper-2); }
.partner-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 52px; }
.partner-card {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 30px; box-shadow: var(--shadow-sm);
  display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: start;
}
.partner-photo { flex: none; width: 116px; height: 116px; border-radius: 20px; overflow: hidden; }
.partner-photo.ph { font-size: 10px; }
.partner-card h3 { font-size: 23px; }
.partner-role { font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
.partner-card p { font-size: 14.5px; color: var(--muted); margin-top: 14px; line-height: 1.6; }
.partner-creds { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
.partner-creds span { font-size: 12px; color: var(--navy-700); background: var(--cream-2); padding: 5px 11px; border-radius: 999px; white-space: nowrap; }

/* ---------- Depoimentos ---------- */
.quotes { background: var(--navy-900); color: #fff; position: relative; overflow: hidden; isolation: isolate; }
.quotes::before {
  content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size: 70px 70px;
  -webkit-mask-image: radial-gradient(110% 90% at 85% 0%, #000, transparent 70%);
          mask-image: radial-gradient(110% 90% at 85% 0%, #000, transparent 70%);
  z-index: -1;
}
.quotes .shead h2 { color: #fff; }
.quotes .shead p { color: rgba(255,255,255,.74); }
.quotes .eyebrow { color: var(--sky); }
.quotes .eyebrow::before { background: var(--sky); }
.quote-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 50px; }
.quote-card {
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
  border-radius: var(--radius); padding: 30px 30px 26px; position: relative;
}
.quote-card .qmark { font-family: var(--font-head); font-weight: 800; font-size: 56px; line-height: .6; color: var(--coral); }
.quote-card p { font-size: 16px; color: rgba(255,255,255,.9); margin-top: 14px; line-height: 1.6; }
.quote-card p b { color: #fff; font-weight: 700; }
.quote-author { margin-top: 18px; font-size: 13px; font-weight: 700; color: var(--sky); text-transform: uppercase; letter-spacing: .06em; }

/* ---------- Responsive ---------- */
@media (max-width: 980px) {
  .nav-links { display: none; }
  .nav-cta { display: none; }
  .hamburger { display: flex; }
  .hero-inner { grid-template-columns: 1fr; }
  .hero-card { max-width: 520px; }
  .about-grid, .diff-grid, .contact-grid { grid-template-columns: 1fr; }
  .about-visual { order: -1; max-width: 460px; }
  .svc-grid { grid-template-columns: 1fr 1fr; }
  .sol-grid { grid-template-columns: 1fr; }
  .method-grid { grid-template-columns: 1fr 1fr; }
  .partner-grid, .quote-grid { grid-template-columns: 1fr; }
  .footer-top { grid-template-columns: 1fr 1fr; gap: 32px; }
}
@media (max-width: 620px) {
  body { font-size: 16px; }
  .svc-grid { grid-template-columns: 1fr; }
  .method-grid { grid-template-columns: 1fr; }
  .partner-card { grid-template-columns: 1fr; }
  .partner-photo { width: 92px; height: 92px; }
  .form-row { grid-template-columns: 1fr; }
  .footer-top { grid-template-columns: 1fr; }
  .about-badge { left: 12px; }
  .hero-stats { grid-template-columns: 1fr 1fr; }
}

/* ---------- Mobile: tipografia e espaçamentos compactos ---------- */
@media (max-width: 600px) {
  .section { padding-block: clamp(54px, 13vw, 72px); }

  .hero-inner { padding-block: 64px 56px; }
  .hero h1 { font-size: 31px !important; line-height: 1.14; margin-top: 16px; }
  .hero-sub { font-size: 16px !important; margin-top: 20px; }
  .hero-actions { margin-top: 28px; }
  .hero-actions .btn { flex: 1 1 auto; justify-content: center; }
  .hero-card { padding: 20px; }
  .hero-stat .n { font-size: 26px; }
  .hero-stat .l { font-size: 12px; }

  h2 { font-size: 25px !important; line-height: 1.16; }
  .shead p, .about-copy p, .diff p, .contact-info p { font-size: 15.5px !important; }
  .eyebrow { font-size: 12px; }

  .svc-card { padding: 26px 22px 28px; }
  .svc-card h3 { font-size: 20px; }

  .method-step { padding: 24px 22px; }
  .method-note { font-size: 16px; }

  .diff-item h4 { font-size: 18px; }
  .diff-item p { font-size: 14.5px; }

  .partner-card { padding: 24px; gap: 16px; }
  .partner-card h3 { font-size: 21px; }
  .partner-photo { width: 84px; height: 84px; }

  .quote-card { padding: 24px 22px 22px; }
  .quote-card p { font-size: 15px; }

  .ctaband h2 { font-size: 26px !important; }
  .ctaband-inner { gap: 24px; }

  .form { padding: 24px 20px; }
  .about-badge { padding: 18px 20px; max-width: 200px; }
  .about-badge .n { font-size: 34px; }

  .nav-logo { height: 54px; }
  .footer-logo { height: 44px; }
  .footer-bottom { flex-direction: column; align-items: flex-start; gap: 10px; }
}

// @ds-adherence-ignore -- omelette starter scaffold (raw elements/hex/px by design)

/* BEGIN USAGE */
// tweaks-panel.jsx
// Reusable Tweaks shell + form-control helpers.
// Exports (to window): useTweaks, TweaksPanel, TweakSection, TweakRow, TweakSlider,
//   TweakToggle, TweakRadio, TweakSelect, TweakText, TweakNumber, TweakColor, TweakButton.
//
// Owns the host protocol (listens for __activate_edit_mode / __deactivate_edit_mode,
// posts __edit_mode_available / __edit_mode_set_keys / __edit_mode_dismissed) so
// individual prototypes don't re-roll it. Ships a consistent set of controls so you
// don't hand-draw <input type="range">, segmented radios, steppers, etc.
//
// Usage (in an HTML file that loads React + Babel):
//
//   const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}
</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {

    <>
      <div className="twk-sect">{label}</div>

function TweakRow({ label, value, children, inline = false }) {

    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>

      {children}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (

                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>

}

/* ---------------- Contato ---------------- */
// Envia o formulário direto para o e-mail via FormSubmit (sem backend próprio).
// 1ª vez: o FormSubmit envia um e-mail de confirmação para contato@goellnerferreira.com.br
// — basta clicar no link uma vez e os envios passam a chegar automaticamente.
const FORM_ENDPOINT = "https://formsubmit.co/ajax/contato@goellnerferreira.com.br";

function Contact() {
  const [data, setData] = useState({ nome: "", email: "", empresa: "", servico: "", msg: "" });
  const [err, setErr] = useState({});
  const [sent, setSent] = useState(false);
  const [sending, setSending] = useState(false);
  const [sendError, setSendError] = useState("");
  const set = (k) => (e) => setData({ ...data, [k]: e.target.value });
  const submit = (e) => {
    e.preventDefault();
    const er = {};
    if (!data.nome.trim()) er.nome = "Informe seu nome.";
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email)) er.email = "E-mail inválido.";
    if (!data.msg.trim()) er.msg = "Conte rapidamente sua necessidade.";
    setErr(er);
    if (Object.keys(er).length > 0) return;

    setSending(true);
    setSendError("");
    const payload = {
      _subject: "Contato pelo site" + (data.empresa ? " — " + data.empresa : ""),
      _template: "table",
      _captcha: "false",
      Nome: data.nome,
      "E-mail": data.email,
      Empresa: data.empresa || "-",
      "Solução de interesse": data.servico || "-",
      Mensagem: data.msg,
    };
    fetch(FORM_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify(payload),
    })
      .then((r) => r.json())
      .then((res) => {
        setSending(false);
        if (res && (res.success === true || res.success === "true")) {
          setSent(true);
        } else {
          setSendError("Não foi possível enviar agora. Tente novamente ou fale pelo WhatsApp.");
        }
      })
      .catch(() => {
        setSending(false);
        setSendError("Não foi possível enviar agora. Verifique sua conexão ou fale pelo WhatsApp.");
      });
  };
  return (
    <section className="section contact" id="contato" data-screen-label="Contato">
      <div className="wrap contact-grid">
        <div className="contact-info reveal">
          <span className="eyebrow">Contato</span>
          <h2 style={{ fontSize: "clamp(28px,3.3vw,42px)", marginTop: 16 }}>Fale com um especialista</h2>
          <p style={{ color: "var(--muted)", marginTop: 16, fontSize: 17 }}>
            Conte o desafio da sua empresa. Quem responde é um dos sócios.
          </p>
          {CONTACTS.map((c) => (
            <div key={c.name} className="ci-item">
              <div className="ci-ic"><Icon name="users" /></div>
              <div>
                <h4>{c.name}</h4>
                <p style={{ fontSize: 14, color: "var(--muted)", marginTop: 2 }}>{c.role}</p>
                <p style={{ marginTop: 6 }}>
                  <a href={"tel:" + c.telHref} style={{ color: "var(--accent-deep)", fontWeight: 600 }}>{c.tel}</a>
                </p>
                <p><a href={"mailto:" + c.email} style={{ color: "var(--accent-deep)" }}>{c.email}</a></p>
              </div>
            </div>
          ))}
        </div>
        <form className="form reveal" onSubmit={submit} noValidate>
          {sent ? (
            <div style={{ textAlign: "center", padding: "30px 8px" }}>
              <div className="ci-ic" style={{ margin: "0 auto 16px", width: 56, height: 56, borderRadius: 16 }}>
                <Icon name="check" style={{ width: 26, height: 26 }} />
              </div>
              <h3 style={{ fontSize: 24 }}>Mensagem enviada!</h3>
              <p style={{ color: "var(--muted)", marginTop: 10 }}>Obrigado, {data.nome.split(" ")[0]}. Sua mensagem foi enviada para a nossa equipe e responderemos em breve.</p>
              <button type="button" className="btn btn-ghost" style={{ marginTop: 22 }}
                onClick={() => { setSent(false); setData({ nome: "", email: "", empresa: "", servico: "", msg: "" }); }}>
                Enviar outra mensagem
              </button>
            </div>
          ) : (
            <React.Fragment>
              <div className="form-row">
                <div className={"field" + (err.nome ? " err" : "")}>
                  <label>Nome*</label>
                  <input value={data.nome} onChange={set("nome")} placeholder="Seu nome" />
                  <div className="msg">{err.nome}</div>
                </div>
                <div className={"field" + (err.email ? " err" : "")}>
                  <label>E-mail*</label>
                  <input value={data.email} onChange={set("email")} placeholder="voce@empresa.com.br" />
                  <div className="msg">{err.email}</div>
                </div>
              </div>
              <div className="form-row">
                <div className="field">
                  <label>Empresa</label>
                  <input value={data.empresa} onChange={set("empresa")} placeholder="Nome da empresa" />
                </div>
                <div className="field">
                  <label>Solução de interesse</label>
                  <select value={data.servico} onChange={set("servico")}>
                    <option value="">Selecione…</option>
                    {SOLUTIONS.map((s) => <option key={s.h} value={s.h}>{s.h}</option>)}
                    <option value="Outro">Outro</option>
                  </select>
                </div>
              </div>
              <div className={"field" + (err.msg ? " err" : "")}>
                <label>Como podemos ajudar?*</label>
                <textarea value={data.msg} onChange={set("msg")} placeholder="Descreva brevemente o desafio da sua empresa…"></textarea>
                <div className="msg">{err.msg}</div>
              </div>
              {sendError && (
                <div className="form-error">{sendError}</div>
              )}
              <button className="btn btn-accent" type="submit" disabled={sending} style={sending ? { opacity: .7, pointerEvents: "none" } : null}>
                {sending ? "Enviando…" : <React.Fragment>Enviar mensagem <Icon name="arrow" /></React.Fragment>}
              </button>
              <p className="form-note">Seus dados são tratados com confidencialidade.</p>
              <div className="form-wa">
                <span className="form-wa-label">Prefere falar agora?</span>
                <div className="form-wa-btns">
                  {CONTACTS.map((c) => (
                    <a key={c.name} className="wa-btn" target="_blank" rel="noopener"
                      href={"https://wa.me/" + c.telHref.replace(/[^0-9]/g, "")}>
                      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M.06 24l1.68-6.13A11.86 11.86 0 010 11.94 11.94 11.94 0 0111.94 0a11.86 11.86 0 018.43 3.5 11.82 11.82 0 013.49 8.44c0 6.58-5.36 11.93-11.94 11.93a11.9 11.9 0 01-5.7-1.45L.06 24zM6.6 20.13c1.68.99 3.28 1.59 5.33 1.59 5.45 0 9.9-4.43 9.9-9.88a9.8 9.8 0 00-2.9-7 9.78 9.78 0 00-7-2.9 9.9 9.9 0 00-9.9 9.9c0 2.07.6 3.62 1.62 5.33l-.99 3.62 3.62-.96zm10.9-3.96c-.07-.12-.27-.2-.57-.35-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51l-.57-.01c-.2 0-.52.07-.8.37s-1.04 1.01-1.04 2.48 1.06 2.88 1.21 3.08c.15.2 2.1 3.2 5.07 4.49.71.3 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2-1.41.25-.69.25-1.28.18-1.41z"/></svg>
                      {c.name.split(" ")[0]}
                    </a>
                  ))}
                </div>
              </div>
            </React.Fragment>
          )}
        </form>
      </div>
    </section>
  );
}

/* ---------------- Tweaks ---------------- */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "headFont": "montserrat",
  "accent": "coral",
  "corners": "soft"
}/*EDITMODE-END*/;

const HEAD_FONTS = {
  montserrat: '"Montserrat", system-ui, sans-serif',
  grotesk: '"Space Grotesk", system-ui, sans-serif',
  archivo: '"Archivo", system-ui, sans-serif',
};

function Tweaks({ t, setTweak }) {
  return (
    <TweaksPanel>
      <TweakSection label="Tipografia" />
      <TweakRadio label="Fonte" value={t.headFont}
        options={[
          { value: "montserrat", label: "Montserrat" },
          { value: "grotesk", label: "Grotesk" },
          { value: "archivo", label: "Archivo" },
        ]}
        onChange={(v) => setTweak("headFont", v)} />
      <TweakSection label="Cor de destaque" />
      <TweakColor label="Acento" value={t.accentColor || "#ff5757"}
        options={["#ff5757", "#0e76cf", "#1f8a82"]}
        onChange={(v) => {
          const map = { "#ff5757": "coral", "#0e76cf": "royal", "#1f8a82": "teal" };
          setTweak({ accentColor: v, accent: map[v] || "coral" });
        }} />
      <TweakSection label="Estilo" />
      <TweakRadio label="Cantos" value={t.corners}
        options={[{ value: "soft", label: "Suaves" }, { value: "sharp", label: "Retos" }]}
        onChange={(v) => setTweak("corners", v)} />
    </TweaksPanel>
  );
}

/* ---------------- App ---------------- */
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll(".reveal");
    const io = new IntersectionObserver((ents) => {
      ents.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  useReveal();
  useEffect(() => {
    document.documentElement.style.setProperty("--font-head", HEAD_FONTS[t.headFont] || HEAD_FONTS.montserrat);
    document.body.dataset.accent = t.accent || "coral";
    document.body.dataset.corners = t.corners || "soft";
  }, [t.headFont, t.accent, t.corners]);

  const onNav = (id) => {
    const el = document.getElementById(id);
    if (el) {
      const y = el.getBoundingClientRect().top + window.scrollY - 76;
      window.scrollTo({ top: id === "inicio" ? 0 : y, behavior: "smooth" });
    }
  };

  return (
    <React.Fragment>
      <Header onNav={onNav} />
      <main>
        <Hero onNav={onNav} />
        <About />
        <Solutions />
        <Partners />
        <Quotes />
        <ClientStrip />
        <BlogHighlights />
        <CtaBand onNav={onNav} />
        <Contact />
      </main>
      <Footer onNav={onNav} />
      <Tweaks t={t} setTweak={setTweak} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
